name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The site is already static, so there is nothing to build — just gather
      # the files that should be public. Every asset path in the HTML is
      # relative, so this works at a domain root and under /<repo>/ alike.
      - name: Collect site files
        run: |
          mkdir -p _site/en
          cp index.html style.css main.js favicon.svg napai-logo.png _site/
          cp en/index.html _site/en/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
